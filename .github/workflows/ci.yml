# Pipeline de CI/CD con GitHub Actions.
# 1) Compila backend y frontend para verificar que no hay errores.
# 2) (Solo en la rama main) construye las imágenes Docker y las publica en Docker Hub.
#
# Requiere configurar en el repo (Settings > Secrets and variables > Actions):
#   - DOCKERHUB_USERNAME : tu usuario de Docker Hub
#   - DOCKERHUB_TOKEN    : un Access Token de Docker Hub

name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # --- Job 1: build y verificación de compilación ---
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Instalar dependencias (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npm install

      - name: Compilar (${{ matrix.service }})
        working-directory: ${{ matrix.service }}
        run: npm run build

  # --- Job 2: build y push de imágenes a Docker Hub (solo en main) ---
  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build y push del backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mundial-backend:latest

      - name: Build y push del frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mundial-frontend:latest
