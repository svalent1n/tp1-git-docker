# Configuración de Nginx para servir la SPA de React.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Ruteo de SPA: cualquier ruta desconocida devuelve index.html para que
    # React Router (o el manejo de rutas del cliente) funcione correctamente.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cacheo agresivo de los assets con hash en el nombre (js, css, imágenes).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
